name: Job Scraper V6.1

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC.
    # These four UTC times cover both CET and CEST.
    # The Brussels-time gate below allows only 10:00 and 20:00 local time.
    - cron: "0 8,9,18,19 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check Brussels schedule
        id: schedule_check
        shell: bash
        run: |
          # Manual runs should always proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: scraper enabled."
            exit 0
          fi

          BRUSSELS_HOUR=$(TZ=Europe/Brussels date +%H)

          echo "Current Brussels hour: $BRUSSELS_HOUR"

          if [ "$BRUSSELS_HOUR" = "10" ] || [ "$BRUSSELS_HOUR" = "20" ]; then
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Brussels-time run enabled."
          else
            echo "run_scraper=false" >> "$GITHUB_OUTPUT"
            echo "DST shadow run: scraper skipped."
          fi

      - name: Checkout repository
        if: steps.schedule_check.outputs.run_scraper == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_check.outputs.run_scraper == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_check.outputs.run_scraper == 'true'
        run: pip install -r V6.1/requirements.txt

      - name: Run Job Scraper V6.1
        if: steps.schedule_check.outputs.run_scraper == 'true'
        working-directory: V6.1
        run: python run_job_scraper_v6_1.py

      - name: Inspect results
        if: steps.schedule_check.outputs.run_scraper == 'true'
        run: |
          echo "=== V6.1 contents ==="
          ls -la V6.1

          if [ -f V6.1/job_market_matches.csv ]; then
            echo "=== Current matches preview ==="
            head -10 V6.1/job_market_matches.csv
          else
            echo "No current matches CSV generated."
          fi

          if [ -f V6.1/job_market_history.csv ]; then
            echo "=== History preview ==="
            head -10 V6.1/job_market_history.csv
          else
            echo "No history CSV generated."
          fi

      - name: Commit results
        if: steps.schedule_check.outputs.run_scraper == 'true'
        run: |
          if [ ! -f V6.1/job_market_matches.csv ]; then
            echo "No current matches CSV to commit."
            exit 0
          fi

          if [ ! -f V6.1/job_market_history.db ]; then
            echo "History database was not generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve generated files before synchronizing.
          cp V6.1/job_market_matches.csv /tmp/job_market_matches.csv
          cp V6.1/job_market_history.db /tmp/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            cp V6.1/job_market_history.csv /tmp/job_market_history.csv
          fi

          # Synchronize with latest main.
          git fetch origin main
          git reset --hard origin/main

          # Restore generated files.
          cp /tmp/job_market_matches.csv V6.1/job_market_matches.csv
          cp /tmp/job_market_history.db V6.1/job_market_history.db

          if [ -f /tmp/job_market_history.csv ]; then
            cp /tmp/job_market_history.csv V6.1/job_market_history.csv
          fi

          # Stage persistent V6.1 output.
          git add V6.1/job_market_matches.csv
          git add V6.1/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            git add V6.1/job_market_history.csv
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update V6.1 job matches and history"
          git push origin HEAD:main
