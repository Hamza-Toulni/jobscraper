name: Job Scraper v4.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r v4.1/requirements.txt

      - name: Run Job Scraper v4.1
        working-directory: v4.1
        run: python run_job_scraper_v4_1.py

      - name: Inspect results
        run: |
          echo "=== v4.1 contents ==="
          ls -la v4.1

          if [ -f v4.1/job_market_matches.csv ]; then
            echo "=== CSV preview ==="
            head -10 v4.1/job_market_matches.csv
          else
            echo "No CSV generated."
          fi

      - name: Commit results
        run: |
          if [ ! -f v4.1/job_market_matches.csv ]; then
            echo "No CSV to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the newly generated v4.1 CSV
          cp v4.1/job_market_matches.csv /tmp/job_market_matches_v4_1.csv

          # Synchronize with the latest main branch
          git fetch origin main
          git reset --hard origin/main

          # Restore the new CSV
          cp /tmp/job_market_matches_v4_1.csv v4.1/job_market_matches.csv

          git add v4.1/job_market_matches.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update v4.1 job matches"
          git push origin HEAD:main
