name: Job Scraper V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r V4/requirements.txt

      - name: Run Job Scraper V4
        working-directory: V4
        run: python run_job_scraper_V4.py

      - name: Inspect results
        run: |
          echo "=== V4 contents ==="
          ls -la V4

          if [ -f V4/job_market_matches.csv ]; then
            echo "=== CSV preview ==="
            head -10 V4/job_market_matches.csv
          else
            echo "No CSV generated."
          fi

      - name: Commit results
        run: |
          if [ ! -f V4/job_market_matches.csv ]; then
            echo "No CSV to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the newly generated V4 CSV
          cp V4/job_market_matches.csv /tmp/job_market_matches_V4.csv

          # Synchronize with the latest main branch
          git fetch origin main
          git reset --hard origin/main

          # Restore the new CSV
          cp /tmp/job_market_matches_V4.csv V4/job_market_matches.csv

          git add V4/job_market_matches.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update V4 job matches"
          git push origin HEAD:main
