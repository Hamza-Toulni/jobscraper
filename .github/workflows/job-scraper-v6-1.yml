name: Job Scraper V6.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r V6.1/requirements.txt

      - name: Run Job Scraper V6.1
        working-directory: V6.1
        run: python run_job_scraper_v6_1.py

      - name: Inspect results
        run: |
          echo "=== V6.1 contents ==="
          ls -la V6.1

          if [ -f V6.1/job_market_matches.csv ]; then
            echo "=== Current matches preview ==="
            head -10 V6.1/job_market_matches.csv
          else
            echo "No current matches CSV generated."
          fi

          if [ -f V6.1/job_market_history.csv ]; then
            echo "=== History preview ==="
            head -10 V6.1/job_market_history.csv
          else
            echo "No history CSV generated."
          fi

      - name: Commit results
        run: |
          if [ ! -f V6.1/job_market_matches.csv ]; then
            echo "No current matches CSV to commit."
            exit 0
          fi

          if [ ! -f V6.1/job_market_history.db ]; then
            echo "History database was not generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve files generated by this run
          cp V6.1/job_market_matches.csv /tmp/job_market_matches.csv
          cp V6.1/job_market_history.db /tmp/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            cp V6.1/job_market_history.csv /tmp/job_market_history.csv
          fi

          # Synchronize with latest main
          git fetch origin main
          git reset --hard origin/main

          # Restore files generated by this run
          cp /tmp/job_market_matches.csv V6.1/job_market_matches.csv
          cp /tmp/job_market_history.db V6.1/job_market_history.db

          if [ -f /tmp/job_market_history.csv ]; then
            cp /tmp/job_market_history.csv V6.1/job_market_history.csv
          fi

          # Stage V6.1 results
          git add V6.1/job_market_matches.csv
          git add V6.1/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            git add V6.1/job_market_history.csv
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update V6.1 job matches and history"
          git push origin HEAD:main
