name: Job Search Agent

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: "0 7 * * *"
    # Every day at 16:00 UTC
    - cron: "0 16 * * *"
    # Every day at 19:00 UTC
    - cron: "0 19 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

# Prevent two scraper runs from pushing to main at the same time
concurrency:
  group: job-search-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # --------------------------------------------------
      # 4. Run the job scraper
      # --------------------------------------------------
      - name: Run job scraper
        run: |
          python main.py

      # --------------------------------------------------
      # 5. Commit updated CSV
      # --------------------------------------------------
      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add job_market_matches.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update job_market_matches.csv [skip ci]"

      # --------------------------------------------------
      # 6. Synchronize with GitHub
      # --------------------------------------------------
      - name: Synchronize with remote
        run: |
          git fetch origin main
          git rebase origin/main

      # --------------------------------------------------
      # 7. Push updated CSV
      # --------------------------------------------------
      - name: Push changes
        run: |
          git push origin main
