name: Job Scraper V6.1

on:
  workflow_dispatch:

  schedule:
    - cron: "10 10 * * *"
      timezone: "Europe/Brussels"

    - cron: "10 20 * * *"
      timezone: "Europe/Brussels"
      


permissions:
  contents: write

concurrency:
  group: job-scraper-v6-1
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r V6.1/requirements.txt

      # --------------------------------------------------------
      # 4. Run V6.1 scraper
      # --------------------------------------------------------
      - name: Run Job Scraper V6.1
        working-directory: V6.1
        run: python run_job_scraper_v6_1.py

      # --------------------------------------------------------
      # 5. Inspect generated results
      # --------------------------------------------------------
      - name: Inspect results
        run: |
          echo "======================================"
          echo "V6.1 GENERATED FILES"
          echo "======================================"
          ls -la V6.1

          echo ""
          echo "======================================"
          echo "CURRENT JOB MATCHES"
          echo "======================================"

          if [ -f V6.1/job_market_matches.csv ]; then
            echo "Number of lines:"
            wc -l V6.1/job_market_matches.csv

            echo ""
            echo "Preview:"
            head -10 V6.1/job_market_matches.csv
          else
            echo "No current matches CSV generated."
          fi

          echo ""
          echo "======================================"
          echo "JOB HISTORY"
          echo "======================================"

          if [ -f V6.1/job_market_history.csv ]; then
            echo "Number of lines:"
            wc -l V6.1/job_market_history.csv

            echo ""
            echo "Preview:"
            head -10 V6.1/job_market_history.csv
          else
            echo "No history CSV generated."
          fi

          echo ""
          echo "======================================"
          echo "SQLITE HISTORY DATABASE"
          echo "======================================"

          if [ -f V6.1/job_market_history.db ]; then
            ls -lh V6.1/job_market_history.db
          else
            echo "History database was not generated."
          fi

      # --------------------------------------------------------
      # 6. Commit results and persistent history
      # --------------------------------------------------------
      - name: Commit results
        run: |
          if [ ! -f V6.1/job_market_matches.csv ]; then
            echo "No current matches CSV to commit."
            exit 0
          fi

          if [ ! -f V6.1/job_market_history.db ]; then
            echo "History database was not generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ----------------------------------------------------
          # Preserve files generated by this run
          # ----------------------------------------------------

          cp V6.1/job_market_matches.csv /tmp/job_market_matches.csv
          cp V6.1/job_market_history.db /tmp/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            cp V6.1/job_market_history.csv /tmp/job_market_history.csv
          fi

          # ----------------------------------------------------
          # Synchronize with latest main branch
          # ----------------------------------------------------

          git fetch origin main
          git reset --hard origin/main

          # ----------------------------------------------------
          # Restore files generated by this run
          # ----------------------------------------------------

          cp /tmp/job_market_matches.csv V6.1/job_market_matches.csv
          cp /tmp/job_market_history.db V6.1/job_market_history.db

          if [ -f /tmp/job_market_history.csv ]; then
            cp /tmp/job_market_history.csv V6.1/job_market_history.csv
          fi

          # ----------------------------------------------------
          # Stage current results + persistent history
          # ----------------------------------------------------

          git add V6.1/job_market_matches.csv
          git add V6.1/job_market_history.db

          if [ -f V6.1/job_market_history.csv ]; then
            git add V6.1/job_market_history.csv
          fi

          # ----------------------------------------------------
          # Commit only when something changed
          # ----------------------------------------------------

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update V6.1 job matches and history"

          # ----------------------------------------------------
          # Push results
          # ----------------------------------------------------

          git push origin HEAD:main
