name: Job Scraper Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: write

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2 scraper
        run: python run_job_scraper.py --verbose

      - name: Inspect result
        run: |
          test -f job_market_matches.csv
          wc -l job_market_matches.csv
          head -n 5 job_market_matches.csv

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add job_market_matches.csv

          if git diff --cached --quiet; then
            echo "No CSV changes."
            exit 0
          fi

          git commit -m "Update real job vacancies"
          git pull --rebase origin main
          git push origin HEAD:main
