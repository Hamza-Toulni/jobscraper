name: Job Scraper Automation

on:
  schedule:
    - cron: '0 8,20 * * *' # Runs at 8:00 AM and 8:00 PM UTC every day
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so GitHub can save the updated CSV back to your repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run scraper script
        run: python run_job_scraper.py

      - name: Commit and push updated CSV
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git pull origin main --rebase --autostash
          git add job_market_matches.csv
          git diff --staged --quiet || git commit -m "Auto-update job_market_matches.csv [skip ci]"
          git push origin main
